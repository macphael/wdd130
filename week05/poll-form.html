<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Poll Form</title>

</head>

<header>
    <h1>WDD 130 | HTML Form - User Poll</h1>
</header>

<main>
    <form>
        <fieldset>
            <legend>Contact Information</legend>
            <label for="fullname">Fullname</label>
            <input type="text" id=Fullname name="fullname" required>
            <label for="useremail">Email</label>
            <input type="email" id="useremail" name="useremail" required>
        </fieldset>
        <fieldset>
            <legend>Questions</legend>
            <label for="browser">What is your favorite browser?</label>
            <select name="browser" id="browser">
                <option value="1">Chrome</option>
                <option value="2">Firefox</option>
                <option value="3">Safari</option>
                <option value="3">Edge</option>
                <option value="3">Brave</option>
                <option value="3">Other</option>
            </select>
            <label for="pet">Do you have a household pet?</label>
            <input type="checkbox" name="pet" id="pet">
            <label for="places">List the places you have lived:</label>
            <textarea id="places" name="places" rows="4" placeholder="Stillwater Florida, Amsterdam Netherlands, Timbuktu, Mali"></textarea>
        </fieldset>
        <button type="submit">Submit Poll</button>
    </form>
</main>

<footer>
    <h2>©2026 | HTML Form User Poll | Alex Daniel</h2>
</footer>

</html>
