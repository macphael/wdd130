<!DOCTYPE html>
<html lang="en-US">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - White Water Rafting</title>
    <meta name="description" content="A page for contacting the company or the extraterrestrials backing them.">
    <meta name="author" content="Alex Daniel">
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/z-downriver.png" alt="The company logo.">
        <nav>r
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <article class="contact">
            <p class="company">White Water Rafting Company</p>
            <p>123 Main River St</p>
            <p>Kolob, California</p>
            <p>999-999-9999</p>
            <p>info@whitewater.com</p>
        </article>

        <div class="forms">
            <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3456.074246329266!2d31.12992057620649!3d29.97729617495729!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x14584f7de239bbcd%3A0xca7474355a6e368b!2sGiza%20Necropolis!5e0!3m2!1sen!2sus!4v1795221835451!5m2!1sen!2sus" allowfullscreen="" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
            <section>
                <legend>Contact Form</legend>
                <div class="name">
                    <label for="name">Name</label>
                    <input type="text" id=name name="name" required>
                </div>
                <div class="email">
                    <label for="email">Email&nbsp;</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <section class="line">
                    <p>Message<br>Purpose</p>
                    <div class="radio">
                        <label for="option1">General Purpose</label>
                        <input type="radio" name="option1 value=" option1">
                        <label for="option2">Reservation Questions</label>
                        <input type="radio" name="option2" value="option2">
                        <label for="option3">Website Suggestions</label>
                        <input type="radio" name="option3" value="option3">
                    </div>
                </section>
                <div class="message">
                    <label for="message">Message:</label>
                    <textarea id="message" name="message" rows="4" placeholder="Type here"></textarea>
                </div>
                <div class="newsletter">
                    <label for="newsletter">Check here to receive a newsletter</label>
                    <input type="checkbox" name="newsletter" id="newsletter">
                </div>
                <div class="button">
                    <button type="submit">Make Contact</button>
                </div>
                </form>
        </div>

        <section class="employees">
            <p>We Are Here to Serve You</p>
            <figure class="pics">
                <img src=" images/rafting22_600.jpg" alt="raft with helmets">
                <figcaption>Lorem ipsum dolor sit.</figcaption>
            </figure>
            <figure class="pics">
                <img src="images/rafting43_600.jpg" alt="lazy river">
                <figcaption>Lorem ipsum dolor sit.</figcaption>
            </figure>
            <figure class="pics">
                <img src="images/rafting26_600.jpg" alt="on the shore">
                <figcaption>Lorem ipsum dolor sit.</figcaption>
            </figure>
        </section>

    </main>

    <footer>
        <p class="socialmedia">©2026 White Water Rafting | Alex Daniel</p>
        <nav class="socialmedia">
            <a href="http://facebook.com"><img src=images/facebook.png alt="facebook icon"></a>
            <a href="http://instagram.com"><img src=images/instagram-square.svg alt="instagram icon"></a>
            <a href="http://youtube.com"><img src=images/youtube-square.svg alt="youtube icon"></a>
        </nav>
    </footer>

</body>

</html>
